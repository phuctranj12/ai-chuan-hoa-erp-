# Chạy trên runner cloud của GitHub — KHÔNG đụng tới server. Bắt lỗi trước khi code chạm server.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main do deploy.yml gọi lại workflow này
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Kiểm kiểu
        run: npm run typecheck
      # Gồm: luồng OAuth đầy đủ với ERP giả lập, kiểm quyền theo grantedPolicies, và test
      # đối chiếu lõi MCP == scripts/normalize-materials.mjs gốc của plugin.
      - name: Test
        run: npm test
      - name: Lỗ hổng thư viện (production)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image mcp + gateway
        run: |
          docker build -f mcp/Dockerfile -t vattu_mcp:ci .
          docker build -t vattu_gateway:ci deploy/gateway
      - name: Image chỉ chứa đúng phần cần thiết
        run: |
          docker run --rm --entrypoint sh vattu_mcp:ci -c '
            set -e
            test -f /app/src/index.ts
            test -f /app/plugin/skills/ai-chuan-hoa-vat-tu-erp/scripts/normalizer.js
            test -f /app/plugin/skills/ai-chuan-hoa-vat-tu-erp/assets/catalogs.json
            test ! -e /app/test && test ! -e /app/plugin/skills/ai-chuan-hoa-vat-tu-erp/assets/AllSizes.json
            test ! -e /app/node_modules/typescript
            test "$(id -u)" != "0"'
      # Dựng stack như trên server (cert tự ký) và gọi qua nginx đúng Host/SNI.
      - name: Chạy stack + kiểm tra qua nginx
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=vattu.ci.test \
            -keyout /tmp/certs/server.key -out /tmp/certs/server.crt
          docker network create cinet
          docker run -d --name mcp --network cinet --read-only --tmpfs /tmp \
            -e VT_PUBLIC_BASE_URL=https://vattu.ci.test -e VT_ENC_KEY="$(openssl rand -base64 32)" vattu_mcp:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mcp)" = healthy ] && break; sleep 2
          done
          docker logs mcp
          [ "$(docker inspect -f '{{.State.Health.Status}}' mcp)" = healthy ]
          docker run -d --name gw --network cinet -p 8443:443 \
            -e SERVER_DOMAIN=vattu.ci.test -e TRUSTED_PROXY_IP=127.0.0.1 \
            -e NGINX_ENVSUBST_FILTER='^(SERVER_DOMAIN|TRUSTED_PROXY_IP)$' \
            -v /tmp/certs:/etc/nginx/certs:ro vattu_gateway:ci
          sleep 3
          docker exec gw nginx -t
          R="--resolve vattu.ci.test:8443:127.0.0.1"
          code=$(curl -sk $R -o /dev/null -w '%{http_code}' -X POST https://vattu.ci.test:8443/mcp -H 'content-type: application/json' -d '{}')
          echo "/mcp -> $code"; [ "$code" = 401 ]
          curl -sk $R https://vattu.ci.test:8443/.well-known/oauth-protected-resource/mcp | tee /dev/stderr | grep -q '"resource":"https://vattu.ci.test/mcp"'
          curl -sk $R https://vattu.ci.test:8443/.well-known/oauth-authorization-server | grep -q '"registration_endpoint":"https://vattu.ci.test/register"'
          # Host lạ / IP thô → 421, không lộ dịch vụ
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/mcp); echo "IP thô -> $code"; [ "$code" = 421 ]
          # Domain thật nhưng redirect_uri lạ → DCR từ chối
          code=$(curl -sk $R -o /dev/null -w '%{http_code}' -X POST https://vattu.ci.test:8443/register -H 'content-type: application/json' \
            -d '{"redirect_uris":["https://evil.example/cb"],"token_endpoint_auth_method":"none"}'); echo "DCR lạ -> $code"; [ "$code" = 400 ]
      - name: Log khi lỗi
        if: failure()
        run: docker logs mcp; docker logs gw || true
